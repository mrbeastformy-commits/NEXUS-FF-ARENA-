<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — NEXUS FF ARENA</title>
    <meta name="theme-color" content="#06070A" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(255, 30, 56, 0.16), transparent 55%), #06070A;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #0d1017;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
      }
      .logo {
        width: 84px;
        height: 84px;
        border-radius: 18px;
        border: 1px solid rgba(212, 175, 55, 0.45);
        object-fit: cover;
        margin: 0 auto 18px;
        display: block;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: 0.04em;
        color: #ffffff;
      }
      .tag {
        margin: 0 0 18px;
        font-size: 11px;
        letter-spacing: 0.22em;
        color: #f5c451;
        font-weight: 700;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.55;
        color: #cbd5e1;
      }
      button {
        width: 100%;
        min-height: 46px;
        border: none;
        border-radius: 12px;
        background: #ff1e38;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/pwa-192x192.png" alt="NEXUS FF ARENA" class="logo" />
      <h1>YOU ARE OFFLINE</h1>
      <p class="tag">PLAY • COMPETE • CONQUER</p>
      <p>
        No internet connection detected. Reconnect to load live tournaments, wallet balances, room credentials, and squad chat.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
