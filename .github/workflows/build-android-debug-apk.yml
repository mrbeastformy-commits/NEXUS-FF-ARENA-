name: Build Android Debug APK & Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional live HTTPS server URL for backend API & WebSocket access"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web app
        env:
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          npm install
          npm run build

      - name: Configure Capacitor Android project
        env:
          CONFIGURED_APP_URL: ${{ inputs.app_url || vars.APP_URL || '' }}
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0

          # Optional: wire deployed HTTPS backend URL if provided via workflow input or repo variable APP_URL
          if [ -n "$CONFIGURED_APP_URL" ]; then
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              cfg.server = cfg.server || {};
              cfg.server.url = process.env.CONFIGURED_APP_URL.replace(/\/+$/, "");
              cfg.server.cleartext = false;
              fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            '
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Apply NEXUS FF ARENA launcher icon across mipmap buckets
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f public/pwa-192x192.png "$dir/ic_launcher.png"
              cp -f public/pwa-192x192.png "$dir/ic_launcher_round.png"
              cp -f public/pwa-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

          # Ensure AndroidManifest.xml includes internet + WebRTC audio/camera permissions
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace(
                  "<application",
                  `    <uses-permission android:name="${p}" />\n    <application`
                );
              }
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/nexus-ff-arena-debug.apk
          ls -lh dist-apk/nexus-ff-arena-debug.apk

      - name: Upload Debug APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ff-arena-debug-apk
          path: dist-apk/nexus-ff-arena-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "NEXUS FF ARENA — Debug APK"
          body: |
            Automated Android Debug APK build for **NEXUS FF ARENA**.

            ### Direct APK Download
            Download **`nexus-ff-arena-debug.apk`** from the Assets section below and install it directly on your Android phone.

            - Build commit: `${{ github.sha }}`
            - Workflow run: `#${{ github.run_number }}`
          files: dist-apk/nexus-ff-arena-debug.apk
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
